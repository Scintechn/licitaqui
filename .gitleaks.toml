# gitleaks configuration (spec §12, `.github/workflows/security.yml`).
#
# The default rule set, plus exactly two exemptions, each pinned the same way. Nothing here weakens the
# scan for any file, rule or commit other than the one named below.
#
# ## Why this file exists
#
# `security.yml` scans a range of *commits*, not the working tree, so a value
# removed in a later commit is still found in the earlier one. U1 committed a
# test fixture for the session-cookie parser as a UUID-shaped string; gitleaks
# scores it at 3.784 entropy and reports it as `generic-api-key`. It is not a
# secret — it never named a session, it was typed by hand, and the test it
# belongs to only checks that `Cookie:` parsing finds the right value.
#
# It was replaced at HEAD with the sentence `session-token-for-the-test`, which
# is what the test should have said in the first place. That fixes every future
# commit and cannot fix the one already pushed: removing it from history means
# rewriting a branch that is already on the remote, and this repository does not
# force-push.
#
# So the exemption is pinned to that single commit **and** that single path, with
# `condition = "AND"` so both must match. A finding anywhere else in that commit
# still fails the run, and a finding in that same file in any other commit —
# including every commit after it — still fails the run.
#
# ## When to delete it
#
# The moment `9991357` stops being reachable from the range being scanned:
# after `task/u1-auth` is squash-merged and the branch is deleted. This file
# then protects nothing and should go with it.

[extend]
useDefault = true

[[allowlists]]
description = "U1's session-cookie test fixture, already replaced at HEAD (see the note above)"
condition = "AND"
commits = ["9991357031634f4edbae1dbf0eabc233e5293429"]
paths = ['''^apps/web/lib/auth/session\.test\.ts$''']

# ──────────────────────────────────────────────────────────────────────────
# D58/D60's scope digest: three constants that look like credentials and are
# not. Added 2026-10-08.
#
# `apps/web/lib/radar/scope.ts` derives an opaque cache key from the request's
# cookies. Two of the findings are **fixture session tokens** in its test and
# the third is `CNPJ_KEY_LABEL`, a **domain-separation label** — a fixed public
# string fed into `createHmac` alongside the real key, which is `AUTH_SECRET`
# and appears in neither file. Publishing all three costs nothing: they are
# inputs to a derivation, not the secret it is keyed with.
#
# gitleaks scored them `generic-api-key` on entropy alone, and it was not
# unreasonable to: an identifier ending `_KEY_LABEL` beside a fixed string is
# the shape of a credential. **They were renamed at HEAD before this entry was
# written** — `SESSION`, `OTHER_SESSION`, and `DEVICE_SCOPE_LABEL` /
# `VIEWER_SCOPE_LABEL` / `CNPJ_TAG_LABEL` — so nothing in the working tree
# trips the rule today and no future commit can re-introduce it under these
# names.
#
# ## Why an exemption and not a history rewrite
#
# `9c13716` is the first commit of `task/d58-d60-snapshot-identity`, and the
# branch was merged into `main` with a **merge commit** (#256), so that commit
# is now in `main`'s history. `security.yml` runs `gitleaks git .` on every
# push to `main`, which scans everything reachable from HEAD — so `main` is red
# until this entry exists. Squash-merging would have avoided it; the branch was
# squashed locally and the force-push failed with a GitHub 500, after which the
# PR was merged normally.
#
# ## This one is permanent, and says so
#
# The entry above promises to be deleted "after `task/u1-auth` is squash-merged
# and the branch is deleted". That never happened: `9991357` is in `main`'s
# history too, so the condition cannot be met and a note written as temporary
# has been permanent since 2026-09. **Do not write that sentence again.** This
# exemption goes when `main`'s history is rewritten, which is to say: not.
#
# What it does not weaken: pinned to one commit AND two paths, with
# `condition = "AND"`, so a finding anywhere else in `9c13716` still fails, and
# a finding in either file in any other commit — including every commit after
# it — still fails.

[[allowlists]]
description = "D58/D60's scope-digest fixtures and labels, renamed at HEAD (see the note above)"
condition = "AND"
commits = ["9c137162b492740de54e37d5018c3d6429ade772"]
paths = [
  '''^apps/web/lib/radar/scope\.test\.ts$''',
  '''^apps/web/lib/radar/scope\.ts$''',
]

# The second, same shape. #261 merged a parametrize label,
# `"brasilapi-404-cnpja-down"`, which `generic-api-key` scores at 3.855 entropy
# because "api" sits in the same line. It is a test-case name. Renamed at HEAD
# (`first-404-second-down`); the commit that introduced it reached `main`
# through a merge commit and cannot leave history without a force-push.
[[allowlists]]
description = "#261's pytest parametrize label in the CNPJ fallback tests, renamed at HEAD"
condition = "AND"
commits = ["66f36923545a9077d57e48003b89c78a3c5df88a"]
paths = ['''^worker/tests/test_integration_company\.py$''']
