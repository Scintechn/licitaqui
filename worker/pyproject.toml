[project]
name = "licitaqui-worker"
version = "0.0.0"
description = "LicitaQui collector and job worker (PNCP, AI screening, alerts)"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "pdfplumber>=0.11",
  "sentry-sdk>=2.20",
  # S3: the edital PDF and its extracted text (spec §3.2). Imported lazily in
  # `licitaqui.storage`, so a worker with no bucket configured never loads it.
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9",
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["licitaqui*", "evaluation*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
