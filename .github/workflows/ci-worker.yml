# Worker CI (spec §13): ruff, pytest, the Neon integration suite, and a Docker
# image that is built on every run and published from `main`.
#
# Scope note, corrected 2026-09-27: the image **is** pushed to GHCR from `main`
# (`GITHUB_TOKEN` + `packages: write`, no configured secret required), and the
# Easypanel redeploy is attempted when `EASYPANEL_WORKER_WEBHOOK` is set and
# skipped with a message when it is not. The note that stood here said neither
# happened, which stopped being true and then misled a cost investigation into
# assuming the running worker was current with `main`. It was six days behind.
#
# Still true, and worth keeping true: this workflow must pass with **zero**
# Actions secrets configured beyond the Neon test DSNs.
name: ci-worker

on:
  pull_request:
    # `labeled` so adding `run-integration` re-runs the workflow and opts this
    # PR back into the Neon suite — see the `integration` job's own condition.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'worker/**'
      - '.github/workflows/ci-worker.yml'
      # An input to this build, not documentation. The worker cannot read
      # `docs/product.json` at runtime (it is outside the Docker context), so
      # `licitaqui/product.py` repeats the numbers and `tests/test_product.py`
      # proves the two still agree. That test is the only thing standing between
      # a price change and a worker that quotes the old one in every template —
      # and until now the edit that breaks it triggered nothing.
      - 'docs/product.json'
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/ci-worker.yml'
      - 'docs/product.json'
  # 06:00 UTC = **03:00 BRT**, the product's clock (CLAUDE.md). Nightly cover
  # for the integration suite now that pull requests no longer run it.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # `github.event_name` is in the key so the nightly `schedule` run cannot
  # cancel an in-flight push to `main`. They resolve to the same ref, and with
  # `cancel-in-progress` a merge landing near 03:00 BRT would otherwise be
  # killed by the cron — and its image would never publish, silently.
  group: ci-worker-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ruff · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install worker with dev extras
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      # Formatting was unchecked until 2026-09-18, so drift reached main twice
      # unnoticed. `ruff check` does not cover it.
      - name: Format (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest

  # The unit job above skips every database test, so it reported "296 passed,
  # 99 skipped" and called that green while two integration tests were broken
  # on main. This job is the one that can actually fail for a broken sync, a
  # lost follow-up or a seat race.
  #
  # Concurrency is safe: since PR #18 every fixture scopes its rows by a
  # per-run id, so two runs — here, or here and a laptop — cannot delete each
  # other's data.
  integration:
    name: integration (Postgres)
    runs-on: ubuntu-latest

    # **Postgres in a container, not Neon.** Three things followed from the old
    # arrangement, and all three are gone:
    #
    # *Cost.* Neon bills wall-clock awake time, and the test databases shared
    # the **production** compute (spec §5.1), so every run woke the live
    # database and held it for the run plus a five-minute tail that cannot be
    # shortened. This job's own note measured it: "the largest single line on
    # the Neon bill after the idle poll: 95 runs in the seven days to
    # 2026-09-27, averaging ~28 minutes each".
    #
    # *Speed.* The same note found the cause: "~1,000 tests in 30 min is 1.8 s
    # each against Neon in sa-east-1 where a round trip is ~200 ms, so most of
    # it is per-test fixture setup rather than assertions." On localhost that
    # round trip is gone rather than tuned.
    #
    # *Safety that had been traded away.* Because it was slow and expensive,
    # this stopped running on pull requests — "a database-level defect now
    # surfaces at merge rather than on the pull request. This suite caught two
    # real ones in the week before this change." It runs on every PR again,
    # which is the point of making it cheap.
    #
    # **What this does not cover.** Neon fronts Postgres with PgBouncer in
    # transaction mode and a container does not. `pg_advisory_lock` is
    # session-scoped and silently non-exclusive through that pooler — it cost a
    # day here — and behaves correctly on a container. Anything asserting
    # pooler semantics needs a Neon database and must say so at the test.
    services:
      postgres:
        # Matches production: Neon reports `pg_version: 18`.
        image: postgres:18
        env:
          POSTGRES_USER: licitaqui
          POSTGRES_PASSWORD: licitaqui
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licitaqui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    timeout-minutes: 45
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install worker with dev extras
        run: pip install -e '.[dev]'

      # The databases are created and migrated from `db/migrations` on every
      # run, which is also why **B25 cannot happen here**: the Neon test
      # databases had drifted three to six migrations behind, silently.
      - name: Create and migrate the test databases
        working-directory: .
        env:
          CI_POSTGRES_URL: postgresql://licitaqui:licitaqui@localhost:5432/postgres
        run: |
          pip install psycopg[binary]
          python db/ci_databases.py
          python db/ci_databases.py --print >> "$GITHUB_ENV"

      - name: Test (pytest, integration)
        env:
          CI_POSTGRES_URL: postgresql://licitaqui:licitaqui@localhost:5432/postgres
        run: |
          set -o pipefail
          pytest -p no:randomly -rs | tee /tmp/pytest.txt
          # A missing variable makes a test skip, not fail — which is exactly
          # how two broken tests reached main. Treat it as a failure here.
          if grep -qi 'is not configured; skipping' /tmp/pytest.txt; then
            echo "::error::A database test skipped for a missing variable."
            grep -i 'is not configured; skipping' /tmp/pytest.txt | sort -u
            exit 1
          fi

  image:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # **A red commit must not become `:latest`.**
    #
    # `integration (Neon)` was failing on `main` for a day on 2026-09-25 while
    # this job stayed green and published the image on every merge — so the
    # tag that Easypanel pulls was built from a commit whose own suite said it
    # was broken. Nothing surfaced that, because the two jobs were independent
    # and only the aggregate PR status went red.
    #
    # `needs:` also stops the build burning twenty minutes of runner time on a
    # commit that has already failed in thirty seconds.
    #
    # The cost is real and accepted: `integration` runs up to 45 minutes, so
    # `:latest` now lands that much later after a merge rather than in
    # parallel. A correct image an hour late beats a broken one immediately —
    # and the queue is durable, so a late redeploy delays work, never loses it.
    #
    # **`skipped` has to be allowed, and only `skipped`.** `integration` no
    # longer runs on an unlabelled pull request, and a bare `needs:` would skip
    # this job with it — taking the Dockerfile build and, worse,
    # `licitaqui.selfcheck` down with it. That check is the one that catches an
    # image which builds perfectly and cannot render a single message, which is
    # exactly what shipped before 2026-09-23. So it must keep running on every
    # PR, while a *failed* integration on `main` still stops the publish dead.
    needs: [quality, integration]
    if: >-
      always()
      && needs.quality.result == 'success'
      && (needs.integration.result == 'success' || needs.integration.result == 'skipped')

    # Only the publish steps below need this, and only on `main`. `contents:
    # read` stays the workflow-wide default for every other job.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Proves the Dockerfile is valid and the package installs in the image.
      - name: Build worker image
        run: docker build -t licitaqui-worker:${{ github.sha }} worker/

      # …and this proves the image can do its job, which the build does not.
      #
      # Every image published before 2026-09-23 built cleanly here and could
      # not render one message: the Dockerfile never copied `worker/templates`,
      # which `licitaqui.templates` resolves relative to the package, so every
      # send raised TemplateNotFound. `events` held zero `telegram.sent` and
      # zero `telegram.dry_run` for the life of the product while this workflow
      # was green — `pytest` above cannot see the fault, because it runs
      # against the checkout, where the directory is right there.
      #
      # So the check runs *inside the artefact*, and before the push steps
      # below, so an image that cannot send is never published.
      - name: The image can render a message
        run: docker run --rm licitaqui-worker:${{ github.sha }} python -m licitaqui.selfcheck

      # Publishing (spec §13, task B1). Only from `main`, so a pull request
      # still just proves the Dockerfile builds.
      #
      # GHCR needs no configured secret: `GITHUB_TOKEN` is minted per run and
      # `packages: write` above is enough. That is why this no longer waits on
      # anything — the original TODO assumed a credential that is not required.
      #
      # `docker login` is the CLI rather than `docker/login-action` on purpose:
      # every third-party action in this repository is pinned by SHA to keep the
      # supply chain reviewable, and not adding one at all is simpler than
      # pinning one.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Lowercase because GHCR rejects an uppercase path, and the owner is
      # `Scintechn`.
      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          repo="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/licitaqui-worker"
          docker tag licitaqui-worker:${{ github.sha }} "$repo:${{ github.sha }}"
          docker tag licitaqui-worker:${{ github.sha }} "$repo:latest"
          docker push "$repo:${{ github.sha }}"
          docker push "$repo:latest"
          echo "published $repo:${{ github.sha }}"

      # The redeploy hook is genuinely optional: Easypanel may not be wired yet,
      # and an unset secret must not turn `main` red.
      #
      # The emptiness check is in the shell rather than in `if:` because the
      # `secrets` context is not dependably available to a step-level condition;
      # reading it through `env` works everywhere and keeps the URL out of the
      # command line, where it would show in the step's own log.
      - name: Tell Easypanel to redeploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WORKER_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "EASYPANEL_WORKER_WEBHOOK is not set - image published, redeploy skipped."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
          echo "redeploy requested"

