# Worker CI (spec §13): ruff, pytest and a Docker image build.
#
# Scope note: the image is built but NOT pushed, and Easypanel is NOT notified.
# Both steps need credentials that do not exist yet (see the TODO in the
# `image` job). This workflow must pass with zero Actions secrets configured.
name: ci-worker

on:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/ci-worker.yml'
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/ci-worker.yml'

permissions:
  contents: read

concurrency:
  group: ci-worker-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ruff · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install worker with dev extras
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

  image:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Proves the Dockerfile is valid and the package installs in the image.
      - name: Build worker image
        run: docker build -t licitaqui-worker:${{ github.sha }} worker/

      # TODO(B1): once GHCR and Easypanel credentials exist, add here — gated on
      # `github.event_name == 'push' && github.ref == 'refs/heads/main'`:
      #   1. docker/login-action (pinned by SHA) against ghcr.io using
      #      ${{ github.actor }} / ${{ secrets.GITHUB_TOKEN }} with
      #      `permissions: packages: write` on this job;
      #   2. push ghcr.io/scintechn/licitaqui-worker:${{ github.sha }} and :latest;
      #   3. curl the Easypanel redeploy webhook, URL from
      #      ${{ secrets.EASYPANEL_WORKER_WEBHOOK }}.
      # Do not add any of this before the secrets are configured: an unset secret
      # makes the step fail on every PR. Spec §13, task B1.
