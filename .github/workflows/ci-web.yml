# Web CI (spec §13): lint, typecheck, tests (Vitest), build.
# Every third-party action is pinned to a commit SHA; the tag in the comment is
# only documentation. No secrets are required: this workflow must stay green on
# a fork PR and on a repository with zero Actions secrets configured.
name: ci-web

# The `docs/` entries are not documentation triggers — they are **inputs to
# this build**. `lib/product.ts` imports `docs/product.json` into the bundle,
# `lib/legal/document.ts` reads `docs/legal/` at build time to generate
# `/termos` and `/privacidade`, and `lib/claims.test.ts` reads `docs/CLAIMS.md`,
# `docs/DEVELOPMENT_PLAN.md` and `CLAUDE.md`. Without them a change to
# `docs/product.json` — the one file a price is supposed to change in — ran no
# workflow at all, so the guard written to prove every other file still agreed
# could not be reached by the only edit that can break it. Listed one by one
# rather than as `docs/**` because `docs/STATUS.md` is appended to on every
# task and must not rebuild the web app. `lib/ci-triggers.test.ts` fails when
# the web app grows a dependency on a `docs/` path that is not listed here.
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-web.yml'
      - 'docs/product.json'
      - 'docs/legal/**'
      - 'docs/CLAIMS.md'
      - 'docs/DEVELOPMENT_PLAN.md'
      - 'CLAUDE.md'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-web.yml'
      - 'docs/product.json'
      - 'docs/legal/**'
      - 'docs/CLAIMS.md'
      - 'docs/DEVELOPMENT_PLAN.md'
      - 'CLAUDE.md'

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# **Repo-wide, and queued rather than cancelled.** Separate from the group
# above, which is per-branch so a second push to one branch still cancels the
# first.
#
# Five of the twelve database suites have no per-task secret and fall back to
# the shared `TEST_DATABASE_URL`. Two of those do not scope their rows by a
# per-run id: `rate-limit.db.test.ts` deletes `bucket like 'rl-db-test:%'` in
# `beforeEach` — a per-task constant, which is the shape CLAUDE.md names
# verbatim — and `founders/signup.db.test.ts` asserts a **global**
# `count(*) from founders_list` is 0. Two runs on one database delete each
# other's rows mid-test, and the failure names the wrong cause.
#
# That was harmless while these suites only ever ran on one laptop, one at a
# time. Turning them on in CI is what makes two runs concurrent, so this job
# serialises across every branch until each suite owns its data (**B24**).
# Queueing costs wall-clock; a suite that fails on somebody else's pull
# request costs trust, and a pipeline nobody trusts gets ignored.

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The repo-wide serialisation the block above the `jobs:` key explains.
    # Job level, so it is independent of the per-branch workflow group, and
    # `cancel-in-progress: false` so a waiting run queues instead of losing.
    concurrency:
      group: ci-web-shared-database
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before setup-node so that `cache: pnpm` can find the store.
      # Version matches `packageManager` in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # `pnpm-workspace.yaml` pins `allowBuilds: { unrs-resolver: true }` so the
      # install never stops for approval here or on Vercel. Do not remove it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # A missing secret makes a `*.db.test.ts` suite skip rather than fail,
      # and a skip reports success. This job ran `pnpm test` with none of these
      # set from the day it was written, so twelve database suites had never
      # run in CI — `founders/signup` among them, which is why CLAUDE.md §4b's
      # "a 500 on the founders signup" shipped with a green suite.
      #
      # `REQUIRE_TEST_DATABASE=1` turns a skip into a failure, and
      # `lib/db/database-suites.test.ts` derives the list of variables from the
      # suites themselves rather than from this file — so a new suite whose
      # secret nobody added fails here, by name, instead of silently skipping.
      #
      # A fork's pull request has no secrets, does not get the flag set to a
      # meaningful value, and keeps skipping: that is the case the skip is for.
      - name: Test
        run: pnpm test
        env:
          # Keyed on **any** of the seven, not on `TEST_DATABASE_URL` alone.
          # Hanging it on one variable meant that rotating or renaming that one
          # secret, with the other six still in place, would send all twelve
          # suites back to skipping silently — and the guard written to catch
          # exactly that would have reported green. One secret away from the
          # failure this job exists to close.
          REQUIRE_TEST_DATABASE: >-
            ${{ (secrets.TEST_DATABASE_URL != ''
              || secrets.TEST_DATABASE_URL_B2 != ''
              || secrets.TEST_DATABASE_URL_D3 != ''
              || secrets.TEST_DATABASE_URL_E1 != ''
              || secrets.TEST_DATABASE_URL_FH != ''
              || secrets.TEST_DATABASE_URL_O1 != ''
              || secrets.TEST_DATABASE_URL_R1 != '') && '1' || '0' }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL_B2: ${{ secrets.TEST_DATABASE_URL_B2 }}
          TEST_DATABASE_URL_D3: ${{ secrets.TEST_DATABASE_URL_D3 }}
          TEST_DATABASE_URL_E1: ${{ secrets.TEST_DATABASE_URL_E1 }}
          TEST_DATABASE_URL_FH: ${{ secrets.TEST_DATABASE_URL_FH }}
          TEST_DATABASE_URL_O1: ${{ secrets.TEST_DATABASE_URL_O1 }}
          TEST_DATABASE_URL_R1: ${{ secrets.TEST_DATABASE_URL_R1 }}

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
