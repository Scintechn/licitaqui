# Web CI (spec §13): lint, typecheck, tests (Vitest), build.
# Every third-party action is pinned to a commit SHA; the tag in the comment is
# only documentation. No secrets are required: this workflow must stay green on
# a fork PR and on a repository with zero Actions secrets configured.
name: ci-web

# The `docs/` entries are not documentation triggers — they are **inputs to
# this build**. `lib/product.ts` imports `docs/product.json` into the bundle,
# `lib/legal/document.ts` reads `docs/legal/` at build time to generate
# `/termos` and `/privacidade`, and `lib/claims.test.ts` reads `docs/CLAIMS.md`,
# `docs/DEVELOPMENT_PLAN.md` and `CLAUDE.md`. Without them a change to
# `docs/product.json` — the one file a price is supposed to change in — ran no
# workflow at all, so the guard written to prove every other file still agreed
# could not be reached by the only edit that can break it. Listed one by one
# rather than as `docs/**` because `docs/STATUS.md` is appended to on every
# task and must not rebuild the web app. `lib/ci-triggers.test.ts` fails when
# the web app grows a dependency on a `docs/` path that is not listed here.
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-web.yml'
      - 'docs/product.json'
      - 'docs/legal/**'
      - 'docs/CLAIMS.md'
      - 'docs/DEVELOPMENT_PLAN.md'
      - 'CLAUDE.md'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-web.yml'
      - 'docs/product.json'
      - 'docs/legal/**'
      - 'docs/CLAIMS.md'
      - 'docs/DEVELOPMENT_PLAN.md'
      - 'CLAUDE.md'

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# **Repo-wide, and queued rather than cancelled.** Separate from the group
# above, which is per-branch so a second push to one branch still cancels the
# first.
#
# **The twelve database suites now run against a Postgres container, not Neon.**
#
# What that fixes, beyond the bill:
#
# *B24 is closed by construction.* Five of the twelve had no per-task secret
# and fell back to the shared `TEST_DATABASE_URL`; two of those did not scope
# their rows by a per-run id — `rate-limit.db.test.ts` deletes
# `bucket like 'rl-db-test:%'` in `beforeEach`, a per-task constant, and
# `founders/signup.db.test.ts` asserts a **global** `count(*) from
# founders_list` is 0. Two runs on one database deleted each other's rows
# mid-test and the failure named the wrong cause. This job used to serialise
# across every branch to avoid it. **Each run now has its own container**, so
# there is nothing to serialise and the group is gone — pull requests stop
# queueing behind each other.
#
# *B25 cannot happen.* The databases are created and migrated from
# `db/migrations` on every run, so they cannot drift behind it the way the
# Neon ones had, three to six migrations deep and silently.
#
# *Cost.* The Neon test databases shared the **production** compute, so every
# run woke the live database and held it awake for the run plus a five-minute
# tail that cannot be shortened.
#
# The suites' own isolation is still worth fixing on its own merits — a test
# that deletes by a per-task constant is wrong wherever it runs — but it is no
# longer load-bearing for CI.

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Matches production: Neon reports `pg_version: 18`.
        image: postgres:18
        env:
          POSTGRES_USER: licitaqui
          POSTGRES_PASSWORD: licitaqui
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licitaqui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before setup-node so that `cache: pnpm` can find the store.
      # Version matches `packageManager` in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # `pnpm-workspace.yaml` pins `allowBuilds: { unrs-resolver: true }` so the
      # install never stops for approval here or on Vercel. Do not remove it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # A missing secret makes a `*.db.test.ts` suite skip rather than fail,
      # and a skip reports success. This job ran `pnpm test` with none of these
      # set from the day it was written, so twelve database suites had never
      # run in CI — `founders/signup` among them, which is why CLAUDE.md §4b's
      # "a 500 on the founders signup" shipped with a green suite.
      #
      # `REQUIRE_TEST_DATABASE=1` turns a skip into a failure, and
      # `lib/db/database-suites.test.ts` derives the list of variables from the
      # suites themselves rather than from this file — so a new suite whose
      # secret nobody added fails here, by name, instead of silently skipping.
      #
      # A fork's pull request has no secrets, does not get the flag set to a
      # meaningful value, and keeps skipping: that is the case the skip is for.
      - name: Create and migrate the test databases
        env:
          CI_POSTGRES_URL: postgresql://licitaqui:licitaqui@localhost:5432/postgres
        run: |
          python3 -m pip install --quiet "psycopg[binary]"
          python3 db/ci_databases.py
          python3 db/ci_databases.py --print >> "$GITHUB_ENV"

      - name: Test
        run: pnpm test
        env:
          # The container is always there, so a skip is always a defect
          # rather than a missing secret. This used to be keyed on whether any
          # of seven Neon secrets existed, because rotating one of them would
          # have sent all twelve suites back to skipping silently while the
          # guard reported green.
          REQUIRE_TEST_DATABASE: '1'

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
