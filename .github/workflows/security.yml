# Secret scanning (spec §12).
#
# **Both of §12's asks are now live.** The repository became public on
# 2026-09-24, which makes GitHub secret scanning and push protection free, and
# both were enabled that day:
#
#   gh api repos/Scintechn/licitaqui -q '.security_and_analysis'
#     secret_scanning:                 enabled
#     secret_scanning_push_protection: enabled
#
# This paragraph used to say the opposite — that a private repository could not
# have them, and that gitleaks was the substitute. It is kept as a **second
# layer**, not a stand-in, because the two catch different things:
#
# | | GitHub secret scanning | gitleaks, here |
# |---|---|---|
# | when | at push time — the secret never reaches the remote | after the push, blocking the merge |
# | what | known provider patterns (AWS, Stripe, Google…), validated against the provider where supported | those **plus** generic high-entropy strings and custom shapes |
# | scope | the whole history, continuously | a PR's own commits; the whole history on `main` |
#
# `secret_scanning_non_provider_patterns` is deliberately **off**: it is what
# would make GitHub's scanner find the generic shapes, and it is noisy. gitleaks
# covers that ground with a config this repository controls.
#
# So push protection is now the thing that stops a secret being published, and
# this workflow is the thing that catches what push protection's pattern list
# does not know about. Keep it required in the branch protection rules for
# `main` — it is no longer the only guard, but it is the only one that fails a
# pull request on a shape GitHub has never seen.
#
# gitleaks is installed from its pinned GitHub release and the archive checksum
# is verified, instead of using gitleaks/gitleaks-action: that action requires a
# GITLEAKS_LICENSE key for organisation-owned repositories, and no secret is
# configured. This workflow needs zero secrets.
name: security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # gitleaks_8.30.1_checksums.txt. Update both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      # fetch-depth: 0 — the whole history is the point; a shallow clone would
      # only see the tip commit.
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # What gets scanned depends on the event, and the difference matters.
      #
      # `gitleaks git .` walks **every reachable commit**, so once any branch is
      # pushed, its commits are reachable from every other branch's checkout. A
      # single finding therefore failed every open pull request at once — on
      # 2026-09-21 a fake session cookie in one lane's test reddened an
      # unrelated migration PR, and the author of that PR had no way to fix it.
      # A check somebody else's branch can break is a check people learn to
      # ignore.
      #
      # So a pull request is judged on **its own commits**: `merge-base..HEAD`
      # is exactly what the author is asking to add, and it is the only thing
      # they can do anything about.
      #
      # `main` keeps the full sweep. That is where the guarantee lives — a
      # secret committed and later deleted is still in the history, and the
      # scoped scan would miss it. Nothing merges without passing both, so the
      # coverage is unchanged; only the blame is now correct.
      - name: Scan the pull request's own commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "${BASE}" HEAD)"
          echo "scanning ${base}..HEAD ($(git rev-list --count "${base}"..HEAD) commits)"
          gitleaks git . --redact --verbose --no-banner --exit-code 1 \
            --log-opts="${base}..HEAD"

      - name: Scan the whole history for secrets
        if: github.event_name != 'pull_request'
        run: gitleaks git . --redact --verbose --no-banner --exit-code 1
